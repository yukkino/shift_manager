<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>シフト確認・申請</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #f8fafc;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .btn-shadow {
            box-shadow: 0 4px 14px 0 rgba(0, 118, 255, 0.15);
        }
        .btn-transition {
            transition: all 0.2s ease;
        }
        .btn-transition:active {
            transform: scale(0.98);
            opacity: 0.9;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4">

    <!-- Header Section -->
    <header class="w-full max-w-md mt-8 mb-10 text-center">
        <h1 class="text-2xl font-bold text-slate-800">Shift Management</h1>
        <p class="text-sm text-slate-500 mt-2">シフト確認・申請ポータル</p>
    </header>

    <!-- Main Content -->
    <main class="w-full max-w-md space-y-6">
        
        <!-- Action 1: Check Shift -->
        <div class="glass-card p-6 rounded-3xl shadow-sm border border-slate-100">
            <div class="flex items-center mb-4">
                <div class="w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center mr-4">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-blue-600" fill="none" viewbox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                    </svg>
                </div>
                <div>
                    <h2 class="font-bold text-slate-800">シフト・担当日の確認</h2>
                    <p class="text-xs text-slate-400 font-medium uppercase tracking-wider">Check Schedule</p>
                </div>
            </div>
            <p class="text-sm text-slate-600 mb-6 leading-relaxed">
                確定済みの担当日、レッスン情報、管理者からの連絡事項を確認できます。
            </p>
            <a href="https://script.google.com/macros/s/AKfycbw3Q2D4KnanzUiImSgMkehWvpw6Q5AAN63k0rA-BbA/exec" 
               class="block w-full py-4 bg-blue-600 text-white text-center font-bold rounded-2xl btn-shadow btn-transition">
                確認画面を開く
            </a>
        </div>

        <!-- Action 2: Apply Shift -->
        <div class="glass-card p-6 rounded-3xl shadow-sm border border-slate-100">
            <div class="flex items-center mb-4">
                <div class="w-10 h-10 bg-emerald-100 rounded-full flex items-center justify-center mr-4">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-emerald-600" fill="none" viewbox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                    </svg>
                </div>
                <div>
                    <h2 class="font-bold text-slate-800 text-sm">【〆9日12:00】シフト希望提出</h2>
                    <p class="text-xs text-slate-400 font-medium uppercase tracking-wider">Application</p>
                </div>
            </div>
            <p class="text-sm text-slate-600 mb-6 leading-relaxed">
                翌々月のシフト希望を提出します。<br>
                <span class="text-rose-500 font-medium">※毎月9日 12:00 締め切り</span>
            </p>
            <a href="https://script.google.com/macros/s/AKfycbxFjRbzYGSf6LiUbteIbuFVuTiyweou4VAp7ub2YVltDApCxL-O3Pj_VrX3Bzy_5Rvp/exec" 
               class="block w-full py-4 bg-emerald-600 text-white text-center font-bold rounded-2xl btn-shadow btn-transition">
                申請フォームを開く
            </a>
        </div>

    </main>

    <!-- Footer -->
    <footer class="mt-auto py-8 text-center">
        <p class="text-xs text-slate-400">&copy; Shift Portal System</p>
    </footer>

</body>
</html>
